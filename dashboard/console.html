<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Revaut — Console de démonstration</title><link rel="stylesheet" href="console.css"></head>
<body><main class="console-shell">
<header class="topbar"><div><p>PROJET GROUPE 8</p><h1>Centre de démonstration Revaut</h1></div><div class="live"><span></span>VM connectée</div></header>
<section class="roles">
<article class="role owner"><div class="role-head"><span>01</span><div><small>PROPRIÉTAIRE</small><h2>Administration</h2></div></div><label>Créer des comptes</label><div class="create-row"><input id="adminNames" value="admin1" placeholder="admin1, admin2, admin3"><button id="createAdmins">Créer</button></div><div id="adminList" class="admin-chips"></div><button class="wide" id="configureDemo">Préparer la VM pour la démonstration</button><button class="wide" id="startAll">Initialiser J2 + J3 + J4</button></article>
<article class="role admin"><div class="role-head"><span>02</span><div><small>COMPTES ADMINISTRATEURS</small><h2>Sessions de test</h2></div></div><label>Administrateur actif</label><select id="activeAdmin"></select><div class="rule-grid"><button data-rule="heure">Connexion hors heures <b>+20</b></button><button data-rule="sudo">Commande sudo <b>+30</b></button><button data-rule="shadow">Lire /etc/shadow <b>+50</b></button></div><button class="wide danger" id="unlockAdmin">Déverrouiller le compte actif</button></article>
<article class="role blockchain"><div class="role-head"><span>03</span><div><small>BLOCKCHAIN</small><h2>Preuve locale</h2></div></div><div class="contract-status"><small>CONTRAT</small><strong id="contractAddress">Non configuré</strong></div><div class="contract-status"><small>RÉSULTAT</small><strong id="contractResult">En attente</strong></div><button class="wide" id="deployContract">Démarrer / Déployer</button></article>
</section>
<section class="terminal-layout">
<article class="terminal"><header><span class="dot red"></span><span class="dot amber"></span><span class="dot green"></span><strong>Terminal J2 — Détection</strong><button data-start="j2">Démarrer</button><button data-stop="j2">Stop</button></header><pre id="terminal-j2"></pre></article>
<article class="terminal"><header><span class="dot red"></span><span class="dot amber"></span><span class="dot green"></span><strong>Terminal J3 — Agent</strong><button data-start="j3">Démarrer</button><button data-stop="j3">Stop</button></header><pre id="terminal-j3"></pre></article>
<article class="terminal"><header><span class="dot red"></span><span class="dot amber"></span><span class="dot green"></span><strong>Terminal J4 — Blockchain</strong><button id="readStatus">Lire admin1</button></header><pre id="terminal-j4"></pre></article>
</section>
</main><script src="console.js"></script></body></html>
